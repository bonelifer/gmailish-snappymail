name: Feature request
description: Suggest an improvement to the theme.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: Proposed change
      description: Describe the interface change or improvement you would like.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it would help
    validations:
      required: true

